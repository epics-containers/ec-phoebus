name: Build and publish image to ghcr.io/epics-containers

on:
  push:
  pull_request:

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - name: Determine container image tag to use
        id: tag
        run: |
          # tag is branch name or tag if there is a tag
          echo "image_tag=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
          # only publish on push events - a pull request must build but not push
          echo "do_push=${{ github.event_name == 'push' }}" >> "$GITHUB_OUTPUT"
          # :latest only ever tracks the default branch or a release tag
          if [[ ${GITHUB_REF} == refs/tags/* ||
                ${GITHUB_REF} == refs/heads/${{ github.event.repository.default_branch }} ]]; then
            echo "latest=ghcr.io/${{ github.repository }}:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache Docker layers
        uses: actions/cache@v3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io/epics-containers
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v3

      - name: Build developer image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ steps.tag.outputs.do_push }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build

      - name: Build runtime image
        uses: docker/build-push-action@v5
        with:
          builder: ${{ steps.buildx.outputs.name }}
          push: ${{ steps.tag.outputs.do_push }}
          tags: |
            ${{ steps.tag.outputs.latest }}
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.image_tag }}.runtime
          target: runtime
          cache-from: type=gha,scope=build
          cache-to: type=gha,mode=max,scope=build
